name: Deploy to GitHub Pages
# الموقع بيتنشر بعد ما الـ APK يتبني وينزل، عشان version.json ميعلنش عن تحديث لسه ملفه مش جاهز
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Build Android APK']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: APK info for version.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(node -p "require('./release.json').version")
          SIZE=$(gh release view "v$V" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[] | select(.name=="rihlat-siraj.apk") | .size' || echo 0)
          echo "APK_VERSION=$V" >> $GITHUB_ENV
          echo "APK_SIZE=${SIZE:-0}" >> $GITHUB_ENV
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
